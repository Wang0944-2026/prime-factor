<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 專案設定
        const firebaseConfig = {
            apiKey: "AIzaSyD98dW35bgVjGZ1PUUgjQsP1q53Sm5QPxA",
            authDomain: "prime-factorization-2ce1f.firebaseapp.com",
            projectId: "prime-factorization-2ce1f",
            storageBucket: "prime-factorization-2ce1f.firebasestorage.app",
            messagingSenderId: "33103319498",
            appId: "1:33103319498:web:0b1fde58630a0b90597f33"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 初始化全域的資料庫輔助物件
        window.dbHelper = {
            ready: false,
            saveScore: async () => false,
            getLeaderboard: async () => []
        };

        // 開啟匿名登入並綁定功能
        signInAnonymously(auth).then(() => {
            window.dbHelper.ready = true;
            
            window.dbHelper.saveScore = async (data) => {
                try {
                    await addDoc(collection(db, "scores"), {
                        ...data,
                        timestamp: serverTimestamp()
                    });
                    return true;
                } catch (e) {
                    console.error("Error adding score: ", e);
                    return false;
                }
            };
            
            window.dbHelper.getLeaderboard = async () => {
                try {
                    const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(10));
                    const querySnapshot = await getDocs(q);
                    const leaderboard = [];
                    querySnapshot.forEach((doc) => {
                        leaderboard.push(doc.data());
                    });
                    return leaderboard;
                } catch (e) {
                    console.error("Error getting leaderboard: ", e);
                    return [];
                }
            };
        }).catch((error) => {
            console.error("Auth error:", error);
            // 當尚未開啟匿名登入時，在畫面上給予友善提示
            window.addEventListener('DOMContentLoaded', () => {
                if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
                    setTimeout(() => {
                        showToast('後台尚未啟用匿名登入功能！請至 Firebase 控制台開啟', 'error');
                    }, 1000);
                }
            });
        });
    </script>

    <style>

        .pulse-green { animation: pulseGreen 0.5s ease-in-out; }
        .pulse-red { animation: pulseRed 0.5s ease-in-out; }
        .shake { animation: shake 0.5s ease-in-out; }

        .combo-message {

            font-weight: bold;

    </style>

    <script>
        // --- 工具：Toast 提示框取代 alert() ---
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white font-bold z-[9999] shadow-lg transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none`;
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            });
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // --- 遊戲狀態 ---
        let gameState = {
            currentQuestion: 0,
            score: 0,
            combo: 0,
            maxCombo: 0,
            difficulty: 'beginner',
            timeMinutes: 1,
            remainingTime: 60,
            totalTime: 60,
            questions: [],
            recentQuestions: [],
            answeredQuestions: 0,
            correctAnswers: 0,
            startTime: null,
            gameEnded: false,
            timerInterval: null
        };

        let dragState = {
            isDragging: false,
            draggedNumber: null,
            ghostElement: null,
            isRemovingFactor: false,
            sourceSlot: null
        };

        const difficultySettings = {
            beginner: { max: 50, factorCount: [2, 3], name: '基礎模式：50以內質因數個數 2-3 個' },
            advanced: { max: 100, factorCount: [2, 4], name: '進階模式：100以內質因數個數 2-4 個' },
            challenge: { max: 100, factorCount: [3, 6], name: '挑戰模式：100以內質因數個數 3 個以上' }
        };

        // --- 數學工具 ---
        function isPrime(n) {
            if (n < 2) return false;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function getFactors(n) {
            const factors = [];
            for (let i = 2; i <= n; i++) {
                while (n % i === 0) {
                    factors.push(i);
                    n /= i;
                }
            }
            return factors.length > 0 ? factors : [n];
        }

        function generateNumbers() {
            const settings = difficultySettings[gameState.difficulty];
            const numbers = [];
            for (let i = 4; i <= settings.max; i++) {
                if (!gameState.recentQuestions.includes(i)) {
                    const factors = getFactors(i);
                    const count = factors.length;
                    if (count >= settings.factorCount[0] && count <= settings.factorCount[1]) {
                        numbers.push({ number: i, factors: factors });
                    }
                }
            }
            return numbers;
        }

        function generateNumberPool(targetNumber, factors) {
            const pool = new Set();
            const max = difficultySettings[gameState.difficulty].max;
            
            factors.forEach(f => pool.add(f)); // 正確答案
            factors.forEach(f => {             // 誘導數字
                if (f > 2) pool.add(f - 1);
                if (f < max) pool.add(f + 1);
            });
            
            // 補充質數
            for (let i = 2; i <= max && pool.size < 12; i++) {
                if (isPrime(i)) pool.add(i);
            }
            // 補充合數
            for (let i = 4; i <= max && pool.size < 12; i++) {
                if (!isPrime(i)) pool.add(i);
            }
            return Array.from(pool).sort((a, b) => a - b).slice(0, 12);
        }

        function vibrate(pattern = [50]) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // --- 初始化與事件綁定 ---
        function setupEventListeners() {
            // 更新遊戲規則文字
            const updateRulesContent = () => {
                const content = document.getElementById('rulesContent');
                const settings = difficultySettings[gameState.difficulty];
                content.innerHTML = `
                    <p>• 將數字拖曳到分解框中完成質因數分解</p>
                    <p>• ${settings.name}</p>
                    <p>• 答對得 1 分，連擊 3 次以上每題額外 +1 分</p>
                    <p>• 答錯或跳過會重置連擊，跳過扣 3 分</p>
                `;
            };
            
            // 初始化規則文字
            updateRulesContent();

            // 設定區按鈕
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.difficulty-btn').forEach(b => {
                        b.classList.remove('active', 'border-emerald-500', 'border-sky-500', 'border-violet-500');
                        b.classList.add('border-transparent');
                    });
                    const color = e.target.classList.contains('text-emerald-800') ? 'emerald' : (e.target.classList.contains('text-sky-800') ? 'sky' : 'violet');
                    e.target.classList.add('active', `border-${color}-500`);
                    e.target.classList.remove('border-transparent');
                    gameState.difficulty = e.target.dataset.difficulty;
                    updateRulesContent(); // 難度改變時更新規則說明
                });
            });

            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.time-btn').forEach(b => {
                        b.classList.remove('active', 'border-amber-500');
                        b.classList.add('border-transparent');
                    });
                    e.target.classList.add('active', 'border-amber-500');
                    e.target.classList.remove('border-transparent');
                    gameState.timeMinutes = parseInt(e.target.dataset.time);
                });
            });

            document.getElementById('startGameBtn').addEventListener('click', startGame);
            document.getElementById('submitBtn').addEventListener('click', checkAnswer);
            document.getElementById('skipBtn').addEventListener('click', skipQuestion);
            document.getElementById('restartBtn').addEventListener('click', restartGame);
            document.getElementById('replayBtn').addEventListener('click', restartGame);
            document.getElementById('changeSettingsBtn').addEventListener('click', backToSettings);

            // 排行榜提交
            document.getElementById('submitScoreBtn').addEventListener('click', submitScore);

            // 獨立排行榜按鈕 (在說明視窗中)
            document.getElementById('showLeaderboardBtn').addEventListener('click', async () => {
                document.getElementById('standaloneLeaderboardModal').classList.remove('hidden');
                document.getElementById('standaloneLeaderboardModal').classList.add('flex');
                
                const list = document.getElementById('standaloneLeaderboardList');
                list.innerHTML = '<div class="text-center text-gray-500 py-8">榜單載入中...</div>';
                
                if (window.dbHelper && window.dbHelper.ready) {
                    const data = await window.dbHelper.getLeaderboard();
                    if (data.length === 0) {
                        list.innerHTML = '<div class="text-center text-gray-500 py-8">目前尚無紀錄，搶當第一名吧！</div>';
                    } else {
                        list.innerHTML = data.map((item, i) => `
                            <div class="flex justify-between items-center bg-indigo-50 px-4 py-3 rounded-xl shadow-sm border border-indigo-100 mb-2">
                                <div class="flex items-center gap-3">
                                    <span class="font-bold text-${i===0 ? 'yellow-500' : (i===1 ? 'gray-400' : (i===2 ? 'amber-600' : 'gray-400'))} w-6 text-center text-lg">${i + 1}</span>
                                    <span class="font-bold text-gray-700 text-lg">${item.name}</span>
                                </div>
                                <div class="font-black text-indigo-600 text-xl">${item.score} <span class="text-sm font-normal text-gray-500">分</span></div>
                            </div>
                        `).join('');
                    }
                } else {
                    list.innerHTML = '<div class="text-center text-red-500 py-8">連線準備中，請稍後再試。</div>';
                }
            });

            document.getElementById('closeLeaderboardBtn').addEventListener('click', () => {
                document.getElementById('standaloneLeaderboardModal').classList.add('hidden');
                document.getElementById('standaloneLeaderboardModal').classList.remove('flex');
            });
        }

        // --- 遊戲生命週期 ---
        function startGame() {
            document.getElementById('rulesScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            initGame();
        }

        function restartGame() {
            document.getElementById('resultModal').classList.add('hidden');
            document.getElementById('resultModal').classList.remove('flex');
            initGame();
        }

        function backToSettings() {
            document.getElementById('resultModal').classList.add('hidden');
            document.getElementById('resultModal').classList.remove('flex');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('rulesScreen').classList.remove('hidden');
            clearInterval(gameState.timerInterval);
        }

        function initGame() {
            gameState.questions = [];
            gameState.currentQuestion = 0;
            gameState.score = 0;
            gameState.combo = 0;
            gameState.maxCombo = 0;
            gameState.answeredQuestions = 0;
            gameState.correctAnswers = 0;
            gameState.gameEnded = false;
            
            // Reset Firebase form
            document.getElementById('playerName').value = '';
            document.getElementById('playerName').disabled = false;
            document.getElementById('submitScoreBtn').disabled = false;
            document.getElementById('submitScoreBtn').textContent = '送出成績';
            document.getElementById('leaderboardArea').classList.add('hidden');

            document.getElementById('gameModeHUD').textContent = `${difficultySettings[gameState.difficulty].name} / ${gameState.timeMinutes}分鐘`;
            updateHUD();
            loadQuestion();
            startTimer();
        }

        // --- 題目載入與渲染 ---
        function loadQuestion() {
            let availableNumbers = generateNumbers();
            if (availableNumbers.length === 0) {
                gameState.recentQuestions = [];
                availableNumbers = generateNumbers();
                if (availableNumbers.length === 0) return endGame();
            }
            
            const question = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];
            
            const newQ = {
                ...question,
                userAnswer: [],
                isCorrect: false,
                isSkipped: false,
                startTime: Date.now()
            };
            
            if (gameState.currentQuestion >= gameState.questions.length) {
                gameState.questions.push(newQ);
            } else {
                gameState.questions[gameState.currentQuestion] = newQ;
            }
            
            gameState.recentQuestions.push(question.number);
            if (gameState.recentQuestions.length > 5) gameState.recentQuestions.shift();
            
            // 更新 UI
            document.getElementById('targetNumber').textContent = question.number;
            document.getElementById('targetNumberDisplay').textContent = question.number;
            document.getElementById('currentQuestion').textContent = gameState.currentQuestion + 1;
            
            rebuildFactorsContainer();
            renderNumberPool(generateNumberPool(question.number, question.factors));
        }

        function rebuildFactorsContainer() {
            const container = document.getElementById('factorsContainer');
            const q = gameState.questions[gameState.currentQuestion];
            const ans = q.userAnswer || [];
            
            container.innerHTML = '';
            
            ans.forEach((num, index) => {
                if (index > 0) container.innerHTML += `<span class="text-gray-600 font-bold mx-1">×</span>`;
                const slot = document.createElement('div');
                // 放大的觸控目標區塊
                slot.className = 'factor-slot draggable-item w-14 h-14 md:w-16 md:h-16 border-2 border-solid border-emerald-500 bg-emerald-100 rounded-xl flex items-center justify-center text-xl md:text-2xl font-bold cursor-pointer hover:bg-emerald-200 transition-all shadow-sm';
                slot.dataset.index = index;
                slot.textContent = num;
                slot.onmousedown = (e) => startDrag(e, num);
                slot.ontouchstart = (e) => startDrag(e, num);
                container.appendChild(slot);
            });
            
            if (ans.length < 6) {
                if (ans.length > 0) container.innerHTML += `<span class="text-gray-600 font-bold mx-1">×</span>`;
                const emptySlot = document.createElement('div');
                emptySlot.className = 'factor-slot w-14 h-14 md:w-16 md:h-16 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center text-xl cursor-pointer hover:border-emerald-400 transition-all';
                emptySlot.dataset.index = ans.length;
                container.appendChild(emptySlot);
            }
        }

        function renderNumberPool(numbers) {
            const poolEl = document.getElementById('numberPool');
            poolEl.innerHTML = numbers.map(num => `
                <div class="draggable-item bg-sky-500 hover:bg-sky-600 text-white aspect-square flex items-center justify-center rounded-xl text-2xl font-bold cursor-grab transition-transform transform active:scale-95 select-none shadow-md"
                     draggable="true" data-number="${num}" 
                     onmousedown="startDrag(event, ${num})" 
                     ontouchstart="startDrag(event, ${num})">${num}</div>
            `).join('');
        }

        // --- 拖曳功能 ---
        function startDrag(event, number) {
            event.preventDefault(); // 防止預設滾動或圈選
            const source = event.target.closest('.factor-slot');
            
            if (source && source.textContent) {
                dragState.isRemovingFactor = true;
                dragState.sourceSlot = source;
                number = parseInt(source.textContent);
            } else {
                dragState.isRemovingFactor = false;
            }
            
            dragState.isDragging = true;
            dragState.draggedNumber = number;
            
            // 處理 touch 或 mouse 座標
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            createGhost(number, clientX, clientY);
            vibrate();
            
            document.addEventListener('mousemove', handleDragMove, {passive: false});
            document.addEventListener('touchmove', handleDragMove, {passive: false});
            document.addEventListener('mouseup', handleDragEnd);
            document.addEventListener('touchend', handleDragEnd);
        }

        function createGhost(num, x, y) {
            dragState.ghostElement = document.createElement('div');
            dragState.ghostElement.className = 'ghost-card';
            dragState.ghostElement.textContent = num;
            dragState.ghostElement.style.left = x + 'px';
            dragState.ghostElement.style.top = y + 'px';
            document.body.appendChild(dragState.ghostElement);
        }

        function handleDragMove(event) {
            if (!dragState.isDragging) return;
            event.preventDefault(); // 強制防止滾動
            
            const x = event.touches ? event.touches[0].clientX : event.clientX;
            const y = event.touches ? event.touches[0].clientY : event.clientY;
            
            if (dragState.ghostElement) {
                dragState.ghostElement.style.left = x + 'px';
                dragState.ghostElement.style.top = y + 'px';
            }
            
            // 磁吸判定
            document.querySelectorAll('.factor-slot').forEach(s => s.classList.remove('magnetic-hover'));
            let target = document.elementFromPoint(x, y);
            if (target && target.classList.contains('factor-slot')) {
                target.classList.add('magnetic-hover');
            }
        }

        function handleDragEnd(event) {
            if (!dragState.isDragging) return;
            
            document.removeEventListener('mousemove', handleDragMove);
            document.removeEventListener('touchmove', handleDragMove);
            document.removeEventListener('mouseup', handleDragEnd);
            document.removeEventListener('touchend', handleDragEnd);
            
            const x = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
            const y = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;
            
            document.querySelectorAll('.factor-slot').forEach(s => s.classList.remove('magnetic-hover'));
            
            let target = document.elementFromPoint(x, y);
            
            if (dragState.isRemovingFactor) {
                // 如果是移除
                if (!target || !target.classList.contains('factor-slot')) {
                    removeFactor(dragState.sourceSlot);
                }
            } else {
                // 如果是放置
                if (target && target.classList.contains('factor-slot')) {
                    placeFactor(target, dragState.draggedNumber);
                }
            }
            
            if (dragState.ghostElement) {
                dragState.ghostElement.remove();
                dragState.ghostElement = null;
            }
            dragState.isDragging = false;
        }

        function placeFactor(slot, num) {
            const q = gameState.questions[gameState.currentQuestion];
            const idx = parseInt(slot.dataset.index);
            if (!q.userAnswer) q.userAnswer = [];
            if (q.userAnswer.length >= 6) return showToast('最多只能分解出 6 個質因數喔！', 'error');
            
            if (slot.textContent === '') {
                q.userAnswer.push(num);
            } else {
                q.userAnswer.splice(idx, 0, num);
            }
            rebuildFactorsContainer();
            vibrate([80]);
        }

        function removeFactor(slot) {
            const q = gameState.questions[gameState.currentQuestion];
            const idx = parseInt(slot.dataset.index);
            q.userAnswer.splice(idx, 1);
            rebuildFactorsContainer();
            vibrate([50]);
        }

        // --- 邏輯判定 ---
        function checkAnswer() {
            const q = gameState.questions[gameState.currentQuestion];
            const ans = q.userAnswer || [];
            
            if (ans.length === 0) {
                return showToast('請先將數字拖曳到框框中！', 'error');
            }
            
            const allPrimes = ans.every(isPrime);
            const product = ans.reduce((acc, curr) => acc * curr, 1);
            const isCorrect = allPrimes && (product === q.number);
            
            q.answerTime = Date.now() - q.startTime;
            q.isCorrect = isCorrect;
            gameState.answeredQuestions++;
            
            const area = document.getElementById('questionArea');
            if (isCorrect) {
                gameState.score++;
                gameState.combo++;
                gameState.correctAnswers++;
                if (gameState.combo >= 3) gameState.score++; // 連擊額外加分
                gameState.maxCombo = Math.max(gameState.maxCombo, gameState.combo);
                
                area.classList.add('pulse-green');
                setTimeout(() => area.classList.remove('pulse-green'), 500);
                vibrate([100, 50, 100]);
            } else {
                gameState.combo = 0;
                area.classList.add('pulse-red', 'shake');
                setTimeout(() => area.classList.remove('pulse-red', 'shake'), 500);
                vibrate([200, 100, 200]);
            }
            
            updateHUD();
            setTimeout(nextQuestion, 600);
        }

        function skipQuestion() {
            const q = gameState.questions[gameState.currentQuestion];
            q.isSkipped = true;
            q.answerTime = Date.now() - q.startTime;
            gameState.answeredQuestions++;
            gameState.combo = 0;
            gameState.score = Math.max(0, gameState.score - 3);
            
            updateHUD();
            nextQuestion();
        }

        function nextQuestion() {
            gameState.currentQuestion++;
            loadQuestion();
        }

        function updateHUD() {
            document.getElementById('score').textContent = gameState.score;
            const comboEl = document.getElementById('comboDisplay');
            if (gameState.combo >= 3) {
                comboEl.classList.remove('hidden');
                document.getElementById('combo').textContent = gameState.combo;
            } else {
                comboEl.classList.add('hidden');
            }
        }

        // --- 計時器 ---
        function startTimer() {
            clearInterval(gameState.timerInterval);
            gameState.remainingTime = gameState.timeMinutes * 60;
            gameState.totalTime = gameState.remainingTime;
            
            updateTimerUI();
            gameState.timerInterval = setInterval(() => {
                if(gameState.remainingTime > 0) {
                    gameState.remainingTime--;
                    updateTimerUI();
                } else {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const m = Math.floor(gameState.remainingTime / 60).toString().padStart(2, '0');
            const s = (gameState.remainingTime % 60).toString().padStart(2, '0');
            const timerEl = document.getElementById('timer');
            timerEl.textContent = `${m}:${s}`;
            
            if (gameState.remainingTime <= 10) timerEl.classList.add('text-red-500');
            else timerEl.classList.remove('text-red-500');
            
            const pct = (gameState.remainingTime / gameState.totalTime) * 100;
            const bar = document.getElementById('progressBar');
            bar.style.width = `${pct}%`;
            bar.className = `h-full transition-all duration-1000 linear ${pct > 50 ? 'bg-emerald-500' : (pct > 25 ? 'bg-amber-500' : 'bg-red-500')}`;
        }

        // --- 結算與排行榜 ---
        function endGame() {
            gameState.gameEnded = true;
            clearInterval(gameState.timerInterval);
            
            const cr = gameState.answeredQuestions > 0 ? Math.round((gameState.correctAnswers / gameState.answeredQuestions) * 100) : 0;
            
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('answerStatus').textContent = `${gameState.correctAnswers}/${gameState.answeredQuestions}`;
            document.getElementById('correctRate').textContent = cr + '%';
            document.getElementById('maxCombo').textContent = gameState.maxCombo;
            
            // 錯題清單
            const wrongs = gameState.questions.filter(q => (!q.isCorrect || q.isSkipped) && q.answerTime > 0);
            const wrongList = document.getElementById('wrongAnswersList');
            if (wrongs.length === 0) {
                wrongList.innerHTML = '<div class="text-center text-gray-500 mt-4">🎉 太厲害了！沒有任何錯題</div>';
            } else {
                wrongList.innerHTML = wrongs.map(q => `
                    <div class="p-3 rounded-lg border-2 ${q.isSkipped ? 'bg-amber-50 border-amber-200' : 'bg-red-50 border-red-200'}">
                        <div class="font-bold text-gray-800">${q.number}</div>
                        <div class="text-green-700 text-sm mt-1">正確: ${q.factors.join(' × ')}</div>
                        <div class="text-${q.isSkipped ? 'amber' : 'red'}-600 text-sm">
                            ${q.isSkipped ? '✗ 已跳過' : `✗ 你的答案: ${(q.userAnswer || []).join(' × ') || '未作答'}`}
                        </div>
                    </div>
                `).join('');
            }
            
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultModal').classList.remove('hidden');
            document.getElementById('resultModal').classList.add('flex');
        }

        // Firebase 記錄成績
        async function submitScore() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim();
            if (!name) return showToast('請填寫班級座號姓名才能記錄！', 'error');
            
            // 驗證格式：3碼數字(班級) + 2碼數字(座號) + 空白 + 姓名
            // 允許學生中間少打空白，例如 "60101 王小明" 或 "601 01 王小明"
            const match = name.match(/^(\d{3})\s*(\d{2})\s+(.+)$/);
            if (!match) {
                return showToast('格式錯誤！請依照格式輸入：60X(班級) 01(座號) 姓名', 'error');
            }
            
            // 將輸入格式標準化，例如統一變成 "601 01 王小明"
            const formattedName = `${match[1]} ${match[2]} ${match[3]}`;
            
            if (!window.dbHelper || !window.dbHelper.ready) {
                return showToast('資料庫尚未就緒，請稍後再試', 'error');
            }

            const btn = document.getElementById('submitScoreBtn');
            btn.disabled = true;
            btn.textContent = '傳送中...';
            
            const success = await window.dbHelper.saveScore({
                name: formattedName,
                score: gameState.score,
                mode: gameState.difficulty,
                time: gameState.timeMinutes
            });
            
            if (success) {
                showToast('成績記錄成功！🏆');
                nameInput.disabled = true;
                btn.textContent = '已送出';
                await loadLeaderboard();
            } else {
                showToast('發生錯誤，請重試', 'error');
                btn.disabled = false;
                btn.textContent = '送出成績';
            }
        }

        async function loadLeaderboard() {
            const area = document.getElementById('leaderboardArea');
            const list = document.getElementById('leaderboardList');
            area.classList.remove('hidden');
            list.innerHTML = '<div class="text-center text-gray-500 text-sm py-4">榜單載入中...</div>';
            
            const data = await window.dbHelper.getLeaderboard();
            if (data.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-500 text-sm py-4">目前尚無紀錄，搶當第一名吧！</div>';
                return;
            }
            
            list.innerHTML = data.map((item, i) => `
                <div class="flex justify-between items-center bg-white px-4 py-2 rounded-lg shadow-sm border border-indigo-50">
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-${i===0 ? 'yellow-500' : (i===1 ? 'gray-400' : (i===2 ? 'amber-600' : 'gray-400'))} w-5 text-center">${i + 1}</span>
                        <span class="font-bold text-gray-700">${item.name}</span>
                    </div>
                    <div class="font-black text-indigo-600">${item.score} <span class="text-xs font-normal text-gray-500">分</span></div>
                </div>
            `).join('');
        }

        // 啟動
        document.addEventListener('DOMContentLoaded', setupEventListeners);
    </script>
</body>
</html>
